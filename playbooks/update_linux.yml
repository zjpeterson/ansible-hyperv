---
- name: Install Linux updates
  hosts: role_linux_server
  become: true

  tasks:
    - name: Ensure official GPG key is imported
      ansible.builtin.rpm_key:
        state: present
        key: /etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release

    - name: Install updates
      ansible.builtin.dnf:
        name: "*"
        state: latest
      notify: Reboot

  handlers:
    - name: Reboot
      ansible.builtin.reboot:
